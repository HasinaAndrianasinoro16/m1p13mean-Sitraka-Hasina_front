<div class="auth-wrapper">

  <div class="auth-card auth-card-xl">

    <!-- HEADER -->
    <div class="auth-header text-center">
      <h2 class="brand-title">COMMERCIAL SHOP</h2>
      <p class="brand-subtitle">Créer un compte boutique</p>
    </div>

    <form (ngSubmit)="registerBoutique()" #registerForm="ngForm">

      <!-- NOM BOUTIQUE -->
      <div class="mb-3">
        <label>Nom de la boutique *</label>
        <input
          type="text"
          class="form-control modern-input"
          placeholder="Nom de votre boutique"
          [(ngModel)]="nomBoutique"
          name="nomBoutique"
          required
        />
      </div>

      <!-- PROPRIETAIRE -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Nom *</label>
          <input
            type="text"
            class="form-control modern-input"
            [(ngModel)]="nom"
            name="nom"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Prénom *</label>
          <input
            type="text"
            class="form-control modern-input"
            [(ngModel)]="prenom"
            name="prenom"
            required
          />
        </div>
      </div>

      <!-- EMAIL / PASSWORD -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Email *</label>
          <input
            type="email"
            class="form-control modern-input"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <div class="col-md-6 mb-3 position-relative">
          <label>Mot de passe *</label>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control modern-input"
            [(ngModel)]="password"
            name="password"
            required
          />
          <span class="password-toggle" (click)="togglePasswordVisibility()">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
      </div>

      <!-- DESCRIPTION -->
      <div class="mb-4">
        <label>Description</label>
        <textarea
          class="form-control modern-input"
          rows="3"
          [(ngModel)]="descriptions"
          name="descriptions"
        ></textarea>
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        class="btn primary-btn w-100"
        [disabled]="isLoading || !registerForm.valid"
      >
        <span *ngIf="!isLoading">Créer un compte</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin me-2"></i>
          Création...
        </span>
      </button>

    </form>

    <!-- LOGIN LINK -->
    <div class="text-center mt-4">
      <small>
        Déjà un compte ?
        <a routerLink="/login" class="auth-link">
          Se connecter
        </a>
      </small>
    </div>

  </div>
</div>
