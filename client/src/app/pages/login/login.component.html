<div class="auth-wrapper">

  <!-- FLÈCHE RETOUR -->
  <a routerLink="/achats" class="back-floating">
    <i class="fas fa-arrow-left"></i>
  </a>

  <div class="auth-card">

    <!-- HEADER -->
    <div class="auth-header text-center">
      <h2 class="brand-title">COMMERCIAL SHOP</h2>
      <p class="brand-subtitle">Connexion à votre compte</p>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="login()" #loginForm="ngForm">

      <!-- EMAIL -->
      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          class="form-control modern-input"
          placeholder="exemple@email.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <!-- PASSWORD -->
      <div class="mb-4 position-relative">
        <label>Mot de passe</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control modern-input"
          placeholder="Mot de passe"
          [(ngModel)]="password"
          name="password"
          required
        />
        <span
          class="password-toggle"
          (click)="togglePasswordVisibility()"
        >
          <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </span>
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        class="btn login-btn w-100"
        [disabled]="!loginForm.valid || isLoading"
      >
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin me-2"></i>
          Connexion...
        </span>
      </button>

    </form>

    <!-- REGISTER LINK -->
    <div class="register-section text-center mt-4">
      <small>
        Vous n'avez pas encore de compte ?
        <a routerLink="/register" class="register-link">
          Créer un compte
        </a>
      </small>
    </div>

  </div>
</div>
