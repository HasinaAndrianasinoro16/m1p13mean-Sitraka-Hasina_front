<div class="auth-wrapper">
  <div class="auth-card">

    <!-- HEADER -->
    <div class="auth-header text-center">
      <h2 class="brand-title">COMMERCIAL SHOP</h2>
      <p class="brand-subtitle">Créer un nouveau compte</p>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="register()" #registerForm="ngForm" class="auth-form">

      <!-- NOM & PRENOM -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Nom</label>
          <input
            type="text"
            class="form-control modern-input"
            placeholder="Votre nom"
            [(ngModel)]="nom"
            name="nom"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label>Prénom</label>
          <input
            type="text"
            class="form-control modern-input"
            placeholder="Votre prénom"
            [(ngModel)]="prenom"
            name="prenom"
            required
          />
        </div>
      </div>

      <!-- EMAIL -->
      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          class="form-control modern-input"
          placeholder="exemple@email.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <!-- PASSWORD -->
      <div class="mb-3 position-relative">
        <label>Mot de passe</label>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control modern-input"
          placeholder="Mot de passe"
          [(ngModel)]="password"
          name="password"
          required
        />
        <span
          class="password-toggle"
          (click)="togglePasswordVisibility()"
        >
          <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </span>
      </div>

      <!-- TELEPHONE -->
      <div class="mb-4">
        <label>Numéro de téléphone</label>
        <input
          type="text"
          class="form-control modern-input"
          placeholder="034 12 345 67"
          [(ngModel)]="telephone"
          name="telephone"
        />
      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        class="btn register-btn w-100"
        [disabled]="isLoading || !registerForm.valid"
      >
        <span *ngIf="!isLoading">Créer un compte</span>
        <span *ngIf="isLoading">
          <i class="fas fa-spinner fa-spin me-2"></i>
          Création...
        </span>
      </button>

      <!-- LOGIN LINK -->
      <div class="text-center mt-3">
        <small>
          Déjà un compte ?
          <a routerLink="/login" class="login-link">
            Se connecter
          </a>
        </small>
      </div>

    </form>
  </div>
</div>
